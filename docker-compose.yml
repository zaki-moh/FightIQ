services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fightiq-backend
    environment:
      DATABASE_URL: sqlite:////app/data/fightiq.db
      RUN_SEED_ON_STARTUP: "1"
      PORT: "8000"
    volumes:
      - fightiq_backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: fightiq-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PORT: "3000"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  fightiq_backend_data:
