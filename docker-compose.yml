services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fightiq-backend
    environment:
      DATABASE_URL: sqlite:////app/data/fightiq.db
      PORT: "8000"
    volumes:
      - fightiq_backend_data:/app/data
    ports:
      - "8000:8000"

volumes:
  fightiq_backend_data:
